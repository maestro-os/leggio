name: Build
on:
  push:
    branches: [master]
  pull_request:
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    name: Build & Checks
    steps:
      - uses: actions/checkout@v6
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libdrm-dev libudev-dev libgbm-dev libxkbcommon-dev \
            libegl1-mesa-dev libwayland-dev libinput-dev libdbus-1-dev libsystemd-dev \
            libseat-dev libdisplay-info-dev libpixman-1-dev
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Cache target
        uses: actions/cache@v5
        with:
          path: target/
          key: cargo-target-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
      - name: Check formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --all-targets
      - name: Build documentation
        run: cargo doc --no-deps
      - name: Build debug
        run: cargo build --all-targets
      - name: Build release
        run: cargo build --release --all-targets
